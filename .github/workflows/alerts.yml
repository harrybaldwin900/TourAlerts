name: alerts
 
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
 
permissions:
  contents: write
 
concurrency:
  group: alerts
 
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for new announcements
        run: python3 alerts.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TICKETMASTER_KEY: ${{ secrets.TICKETMASTER_KEY }}
      - name: Save what has been seen
        run: |
          git config user.name "alert-bot"
          git config user.email "alert-bot@users.noreply.github.com"
          git add seen.json heartbeat.txt
          git diff --staged --quiet || (git commit -m "update seen" && git push)
